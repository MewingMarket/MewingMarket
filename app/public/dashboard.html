<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Utente — MewingMarket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        });
    });
  </script>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profilo.css">

  <style>
    body {
      background:#f3f3f3;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .dashboard {
      display:flex;
      max-width:1200px;
      margin:40px auto;
      gap:25px;
    }
    .sidebar {
      width:260px;
      background:#fff;
      padding:20px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
    }
    .sidebar h2 {
      margin-bottom:20px;
      font-size:22px;
      color:#111;
    }
    .sidebar a {
      display:block;
      padding:12px;
      border-radius:8px;
      margin-bottom:10px;
      text-decoration:none;
      color:#111;
      background:#f5f5f5;
      font-weight:600;
      transition:background .15s,color .15s;
    }
    .sidebar a.active {
      background:#0077ff;
      color:#fff;
    }
    .content {
      flex:1;
      background:#fff;
      padding:25px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
      min-height:400px;
    }
    .orders-table {
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }
    .orders-table th,
    .orders-table td {
      border-bottom:1px solid #eee;
      padding:8px 6px;
      font-size:14px;
      vertical-align:top;
    }
    .orders-table th {
      text-align:left;
      color:#555;
    }
    .btn-small {
      display:inline-block;
      padding:6px 10px;
      border-radius:6px;
      background:#0077ff;
      color:#fff;
      text-decoration:none;
      font-size:13px;
      border:none;
      cursor:pointer;
    }
    .btn-small.danger {
      background:#d9534f;
    }
    .download-item {
      padding:10px 0;
      border-bottom:1px solid #eee;
    }
  </style>

  <script src="carrello.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>

<body>

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("header.html")
      .then(r => r.text())
      .then(h => {
        document.getElementById("header-placeholder").innerHTML = h;

        const cartWrapper = document.createElement("div");
        cartWrapper.id = "cart-wrapper";
        cartWrapper.style.position = "relative";
        cartWrapper.style.cursor = "pointer";
        cartWrapper.style.marginLeft = "14px";

        const cartIcon = document.createElement("div");
        cartIcon.id = "cart-icon";
        cartIcon.innerHTML = "🛒";
        cartIcon.style.fontSize = "26px";

        const cartBadge = document.createElement("div");
        cartBadge.id = "cart-badge";
        cartBadge.textContent = "0";
        cartBadge.style.position = "absolute";
        cartBadge.style.top = "-6px";
        cartBadge.style.right = "-10px";
        cartBadge.style.background = "black";
        cartBadge.style.color = "white";
        cartBadge.style.fontSize = "12px";
        cartBadge.style.padding = "2px 6px";
        cartBadge.style.borderRadius = "50%";
        cartBadge.style.fontWeight = "bold";

        cartWrapper.appendChild(cartIcon);
        cartWrapper.appendChild(cartBadge);

        cartWrapper.addEventListener("click", () => {
          window.location.href = "checkout.html";
        });

        const nav = document.querySelector("header nav");
        if (nav) nav.appendChild(cartWrapper);

        if (typeof aggiornaBadgeCarrello === "function") {
          aggiornaBadgeCarrello();
        }
      });
  });
</script>

<div class="dashboard">

  <div class="sidebar">
    <h2>Il tuo account</h2>

    <a href="#" data-section="profile" class="active">Profilo</a>
    <a href="#" data-section="orders">I miei ordini</a>
    <a href="#" data-section="downloads">Download</a>
    <a href="#" data-section="reviews">Le mie recensioni</a>
    <a href="#" data-section="delete">Annulla registrazione</a>
    <a href="#" data-section="logout" style="color:#d00;">Logout</a>
  </div>

  <div class="content" id="content">
    <!-- Sezioni caricate dinamicamente -->
  </div>

</div>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("footer.html")
      .then(r => r.text())
      .then(h => document.getElementById("footer-placeholder").innerHTML = h);
  });
</script>

</body>
</html>

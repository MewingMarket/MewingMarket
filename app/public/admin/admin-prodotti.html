<script type="module" src="/loadersupremo.js?v=2050"></script>
<script src="/admin/admin-prodotti.js?v=2050"></script>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Gestione Prodotti | MewingMarket</title>
</head>

<body>

  <div id="head-admin-placeholder"></div>
  <div id="header-admin-placeholder"></div>

  <main class="pagina-standard">

    <h1>Gestione Prodotti</h1>

    <!-- ========================================================= -->
    <!-- SEZIONE 1 — PRODOTTI PUBBLICATI -->
    <!-- ========================================================= -->
    <section class="box-standard">
      <h2>Prodotti Pubblicati</h2>

      <div id="lista-pubblicati" class="catalogo-grid">
        <p>Caricamento prodotti...</p>
      </div>
    </section>

    <!-- ========================================================= -->
    <!-- SEZIONE 2 — PRODOTTI DA GENERARE (AI) -->
    <!-- ========================================================= -->
    <section class="box-standard">
      <h2>Prodotti da Generare (AI)</h2>

      <div id="lista-da-creare" class="catalogo-grid">
        <p>Caricamento prodotti da creare...</p>
      </div>
    </section>

    <!-- ========================================================= -->
    <!-- SEZIONE 3 — EDITOR PRODOTTO PUBBLICATO -->
    <!-- ========================================================= -->
    <section class="box-standard" id="sezione-edit-pubblicato" style="display:none;">
      <h2 id="titolo-edit-pubblicato">Modifica Prodotto</h2>

      <div class="form-standard">

        <label for="edit-titolo">Titolo</label>
        <input type="text" id="edit-titolo">

        <label for="edit-descrizione">Descrizione Lunga</label>
        <textarea id="edit-descrizione" rows="6"></textarea>

        <label for="edit-prezzo">Prezzo (€)</label>
        <input type="number" id="edit-prezzo" step="0.01">

        <label for="edit-immagine-url">URL Immagine</label>
        <input type="url" id="edit-immagine-url">

        <div style="text-align:center;margin:10px 0;">
          <img id="edit-preview-img" style="max-width:200px;display:none;border-radius:8px;border:1px solid #ccc;">
        </div>

        <button id="btn-salva-pubblicato" class="btn-primario" style="width:100%;padding:15px;font-weight:bold;">
          SALVA MODIFICHE
        </button>

        <p id="status-pubblicato" style="margin-top:15px;text-align:center;font-weight:500;"></p>

      </div>
    </section>

    <!-- ========================================================= -->
    <!-- SEZIONE 4 — EDITOR PRODOTTO DA CREARE (AI) -->
    <!-- ========================================================= -->
    <section class="box-standard" id="sezione-edit-da-creare" style="display:none;">
      <h2 id="titolo-edit-da-creare">Prodotto AI</h2>

      <div class="form-standard">

        <label>Titolo</label>
        <input type="text" id="ai-titolo" disabled>

        <label>Categoria</label>
        <input type="text" id="ai-categoria" disabled>

        <label>Prezzo (€)</label>
        <input type="number" id="ai-prezzo" step="0.01">

        <label>Descrizione Tecnica (AI)</label>
        <textarea id="ai-descrizione-tecnica" rows="6"></textarea>

        <label>URL Immagine</label>
        <input type="url" id="ai-immagine-url">

        <div style="text-align:center;margin:10px 0;">
          <img id="ai-preview-img" style="max-width:200px;display:none;border-radius:8px;border:1px solid #ccc;">
        </div>

        <label>File PDF / ZIP</label>
        <input type="file" id="ai-file">

        <button id="btn-approva-prodotto" class="btn-primario" style="width:100%;padding:15px;font-weight:bold;">
          APPROVA E PUBBLICA
        </button>

        <button id="btn-elimina-da-creare" class="btn-secondario" style="width:100%;padding:15px;margin-top:10px;">
          ELIMINA
        </button>

        <p id="status-da-creare" style="margin-top:15px;text-align:center;font-weight:500;"></p>

      </div>
    </section>

  </main>

  <div id="footer-admin-placeholder"></div>

  <!-- 🔥 UNICO SCRIPT CONSENTITO -->
  

</body>
</html>

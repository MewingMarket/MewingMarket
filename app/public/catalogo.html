<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS SHOP -->
  <link rel="stylesheet" href="/header-shop.css">

  <!-- CSS SPECIFICO PAGINA -->
  <link rel="stylesheet" href="/catalogo.css">
</head>

<body class="pagina-standard-body">

  <!-- HEAD DINAMICO -->
  <div id="head-placeholder"></div>

  <!-- HEADER DINAMICO (blindato) -->
  <div id="header-placeholder"></div>

  <main class="pagina-standard">

    <h1>Catalogo Prodotti</h1>

    <!-- FILTRI -->
    <section class="filtri-catalogo">

      <!-- CATEGORIE DINAMICHE -->
      <div id="categorie" class="categorie-box"></div>

      <!-- FILTRI PREZZO -->
      <div class="filtri-prezzo">
        <button class="btn" data-prezzo="10">Fino a 10€</button>
        <button class="btn" data-prezzo="20">Fino a 20€</button>
        <button class="btn" data-prezzo="50">Fino a 50€</button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </section>

    <!-- GRID PRODOTTI -->
    <section id="catalogo" class="catalogo-grid"></section>

  </main>

  <!-- FOOTER DINAMICO -->
  <div id="footer-placeholder"></div>

  <!-- JS GLOBALI + JS DI PAGINA (ordine gestito dal rewriter) -->
  <script src="/loader.js?v=20260412" type="text/javascript" crossorigin="anonymous"></script>
  <script src="/catalogo.js?v=20260420" type="text/javascript" charset="UTF-8" crossorigin="anonymous"></script>
  <script src="/dynamic-loader.js?v=20260412" type="text/javascript" crossorigin="anonymous"></script>

</body>
</html>

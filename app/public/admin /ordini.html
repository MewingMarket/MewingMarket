<!DOCTYPE html>
<html lang="it">
<head>

  <!-- HEAD ADMIN DINAMICO -->
  

  <title>Ordini – Admin MewingMarket</title>

  
  


    <script src="/seo.js"></script>
    <script src="/structured-data.js"></script>
  
</head>

<body>














<!-- NAV ADMIN DINAMICO -->
<div id="nav-admin-placeholder"></div>


<main class="pagina-standard" style="margin-top:20px;">

  <h1>Ordini</h1>

  <!-- METRICHE -->
  <section class="box-standard">
    <h2>Panoramica ordini</h2>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Ordini totali</h3>
        <p id="ordini-totali">—</p>
      </div>

      <div class="stat-card">
        <h3>Ordini completati</h3>
        <p id="ordini-completati">—</p>
      </div>

      <div class="stat-card">
        <h3>Carrelli abbandonati</h3>
        <p id="ordini-abbandonati">—</p>
      </div>
    </div>
  </section>

  <!-- TABELLA ORDINI -->
  <section class="box-standard" style="margin-top:30px;">
    <h2>Lista ordini</h2>

    <table class="tabella-standard" id="tabella-ordini">
      <thead>
        <tr>
          <th>ID Ordine</th>
          <th>Prodotto</th>
          <th>Prezzo</th>
          <th>Stato</th>
          <th>Utente</th>
          <th>Origine</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

</main>

<!-- FOOTER ADMIN DINAMICO -->
<div id="footer-admin-placeholder"></div>



         
         
         
         
         
         <script src="tracking.js"></script>
         
         
         
</body>
</html>

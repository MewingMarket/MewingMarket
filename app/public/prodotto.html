<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        })
        .catch(err => console.error("Errore caricamento head:", err));
    });
  </script>


  <script src="carrello.js" defer></script>

  <!-- CSS PAGINE SHOP -->
  <link rel="stylesheet" href="prodotto.css" />
  <link rel="stylesheet" href="shop.css" />
</head>

<body>

<script src="auth.js"></script>
<script src="loader-header-footer.js"></script>
<script src="header-shop.js"></script>
<script src="footer.js"></script>
<script src="tracking.js"></script>
<script src="structured-data.js"></script>
<script src="seo.js"></script>



<!-- AUTH GLOBALE -->

<!-- LOGICA HEADER SHOP -->

<!-- LOGICA FOOTER -->

<!-- TRACKING UNIVERSALE -->


  
<!-- SEO DINAMICO -->
<!-- HEADER SHOP -->
<div id="header-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("header-shop.html")
      .then(r => r.text())
      .then(h => {
        document.getElementById("header-placeholder").innerHTML = h;

        /* ================================
           ICONA CARRELLO + BADGE
        ================================= */
        const cartWrapper = document.createElement("div");
        cartWrapper.id = "cart-wrapper";

        const cartIcon = document.createElement("div");
        cartIcon.id = "cart-icon";
        cartIcon.innerHTML = "🛒";

        const cartBadge = document.createElement("div");
        cartBadge.id = "cart-badge";
        cartBadge.textContent = "0";

        cartWrapper.appendChild(cartIcon);
        cartWrapper.appendChild(cartBadge);

        cartWrapper.addEventListener("click", () => {
          window.location.href = "checkout.html";
        });

        const nav = document.querySelector("header nav");
        if (nav) nav.appendChild(cartWrapper);

        setTimeout(() => {
          if (typeof aggiornaBadgeCarrello === "function") {
            aggiornaBadgeCarrello();
          }
        }, 50);
      })
      .catch(err => console.error("Errore caricamento header-shop:", err));
  });
</script>

<main id="page-product">

  <!-- HERO PREMIUM -->
  <section id="hero" class="hero-premium">
    <div class="hero-left">
      <img id="product-image" src="" alt="Prodotto" />
    </div>

    <div class="hero-right">
      <h1 id="product-title"></h1>
      <p id="product-subtitle" class="subtitle"></p>

      <div class="price-box">
        <span id="product-price"></span>
      </div>

      <div class="trust-badges">
        <span>✔ Pagamento sicuro</span>
        <span>✔ Accesso immediato</span>
        <span>✔ Supporto incluso</span>
      </div>
    </div>
  </section>

  <!-- VIDEO + DESCRIZIONE AFFIANCATI -->
  <section class="video-descrizione-wrapper">

    <!-- VIDEO -->
    <div id="video-section" style="display:none;">
      <iframe id="product-video" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- DESCRIZIONE + BOTTONI -->
    <div id="descrizione">
      <h2>Descrizione</h2>
      <div id="product-description"></div>

      <div class="cta-box sotto-descrizione">
        <button id="btn-acquista" class="btn-primario">Acquista ora</button>
        <button id="btn-carrello" class="btn-secondario">Aggiungi al carrello</button>
      </div>
    </div>

  </section>

  <!-- CORRELATI -->
  <section class="related-section">
    <h2>Potrebbe interessarti anche</h2>
    <div class="catalogo-grid" id="related"></div>
  </section>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
      .then(r => r.text())
      .then(h => {
        document.getElementById("footer-placeholder").innerHTML = h;
      })
      .catch(err => console.error("Errore caricamento footer:", err));
  });
</script>

<!-- TRACKING -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const slug = new URLSearchParams(window.location.search).get("slug");
  if (window.trackEvent && slug) {
    trackEvent("product_view", { slug });
  }
});
</script>

<!-- JS PRODOTTO -->
<script src="prodotto.js" defer></script>

</body>
</html>

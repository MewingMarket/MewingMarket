<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MewingMarket | Dettaglio Prodotto</title>
  <link rel="stylesheet" href="header-shop.css">
  <link rel="stylesheet" href="prodotto.css">
  <link rel="stylesheet" href="catalogo.css"> 
  <style>
    /* Stile rapido per i tasti +/- */
    .qty-controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; }
    .btn-qty { 
      width: 35px; height: 35px; border-radius: 50%; border: 1px solid #ccc; 
      background: white; cursor: pointer; font-size: 18px; font-weight: bold;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .btn-qty:hover { background: #f0f0f0; border-color: #000; }
    .btn-qty.plus { background: #000; color: #fff; border: none; }
    .btn-qty.plus:hover { background: #333; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div id="head-placeholder"></div>
  <div id="header-placeholder"></div>

  <main id="page-product" class="pagina-standard">
    <section id="hero" class="hero-premium">
      <div class="hero-left">
        <img id="prodotto-immagine" src="/placeholder.webp" alt="Caricamento...">
      </div>

      <div class="hero-right">
        <h1 id="prodotto-titolo">Caricamento...</h1>
        <p id="prodotto-subtitle" class="subtitle"></p>
        <div class="price-box">
          <span id="prodotto-prezzo">--,--€</span>
        </div>
        
        <div class="trust-badges">
          <span>✔ Pagamento sicuro</span>
          <span>✔ Accesso immediato</span>
        </div>

        <div class="cta-box-hero" style="margin-top: 25px;">
          <button id="btn-acquista-hero" class="btn-primario" onclick="document.getElementById('btn-paga-subito').click()">
            Acquista Ora
          </button>
        </div>
      </div>
    </section>

    <section class="video-descrizione-wrapper">
      <div id="video-section" class="video-wrapper" style="display:none; margin-bottom: 30px;">
        <h2>Video Approfondimento</h2>
        <div class="video-container">
          <iframe id="prodotto-video" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>

      <div id="descrizione">
        <h2>Descrizione Completa</h2>
        <div id="prodotto-descrizione" class="testo-ai-content">
          <p>Recupero informazioni dal server...</p>
        </div>

        <div class="cta-box sotto-descrizione">
          <button id="btn-paga-subito" class="btn-primario">Procedi al pagamento</button>
          
          <div class="qty-controls">
            <button id="btn-rimuovi" class="btn-qty minus">−</button>
            <span style="font-size: 0.9em; color: #666;">Quantità</span>
            <button id="btn-aggiungi" class="btn-qty plus">+</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/loader.js?v=20260412"></script>
  <script src="/dynamic-loader.js?v=20260412"></script>
  <script src="/prodotto.js?v=20260412"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="pagina-standard.css">
  <link rel="stylesheet" href="rimborso.css">
</head>

<body class="pagina-standard-body">

<div id="head-placeholder"></div>
<div id="header-placeholder"></div>

<main class="pagina-standard">
  <h1>Richiedi un rimborso</h1>
  <p>Compila il modulo per inviare la tua richiesta.</p>

  <form id="rimborsoForm" class="rimborso-form">
    <label>Email</label>
    <input type="email" id="email" required>

    <label>ID Ordine</label>
    <input type="text" id="ordine" required>

    <label>Motivo della richiesta</label>
    <textarea id="motivo" rows="6" required></textarea>

    <button type="submit" class="rimborso-btn">Invia richiesta</button>
  </form>

  <div class="rimborso-info">
    <p>Hai bisogno di aiuto immediato?</p>
    <p><a href="https://wa.me/393520266660">WhatsApp Business →</a></p>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="rimborso.js"></script>
<script src="loader-header-footer.js"></script>
<script src="seo.js"></script>
<script src="structured-data.js"></script>

</body>
</html>

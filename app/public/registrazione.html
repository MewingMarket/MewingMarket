<!DOCTYPE html>
<html lang="it">
<head>

  <!-- HEAD DINAMICO -->
  

  <title>Registrazione — MewingMarket</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background:#f7faff;
      font-family:system-ui, sans-serif;
      color:#003366;
    }
    .register-box {
      max-width:400px;
      margin:60px auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
    }
    input {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #cdd7e1;
      font-size:16px;
    }
    button {
      width:100%;
      margin-top:20px;
      padding:12px;
      background:#0077ff;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      font-weight:600;
      transition:0.2s;
    }
    button:hover {
      background:#005fe0;
    }
    #status {
      margin-top:15px;
      font-size:14px;
      color:#d00;
      text-align:center;
      font-weight:600;
    }
  </style>


    <script src="/seo.js"></script>
    <script src="/structured-data.js"></script>
  
</head>

<body>




















  

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>


<main>

  <div class="register-box">
    <h1>Crea un account</h1>

    <form id="register-form">
      <label>Email</label>
      <input type="email" name="email" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <label>Conferma password</label>
      <input type="password" name="confirmPassword" required>

      <button type="submit">Registrati</button>
    </form>

    <div id="status"></div>
  </div>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>





         
         
         
         
         
         
         
         
         
<script src="tracking.js"></script>
<script src="loader-header-footer.js"></script>
<script src="seo.js"></script>
<script src="structured-data.js"></script>
</body>
</html>

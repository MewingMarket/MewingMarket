<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Le mie recensioni — MewingMarket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HEAD DINAMICO -->
  

  <link rel="stylesheet" href="style.css">

  <style>
    body { background:#f7faff; margin:0; font-family:system-ui; color:#003366; }
    .box {
      max-width:900px; margin:40px auto; background:white;
      padding:25px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { margin-top:0; }
    select, textarea {
      width:100%; padding:10px; border-radius:8px;
      border:1px solid #cdd7e1; font-size:15px;
    }
    textarea { height:120px; resize:none; }
    #stars span {
      font-size:32px; cursor:pointer; padding:5px;
      color:#ccc; transition:0.2s;
    }
    #stars span.active { color:#ffb400; }
    .btn {
      padding:10px 16px; border-radius:8px; border:none;
      cursor:pointer; font-size:15px; font-weight:600;
    }
    .btn-primary { background:#0077ff; color:white; }
    .btn-primary:hover { background:#005fe0; }
    .status { margin-top:12px; font-weight:600; }
    .status.ok { color:#4ade80; }
    .status.err { color:#f97373; }
    .review-item {
      padding:15px; border-bottom:1px solid #eee;
    }
    .review-item strong { font-size:16px; }
  </style>

    <script src="/seo.js"></script>
    <script src="/structured-data.js"></script>
  
</head>

<body>




















  

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>


<div class="box">
  <h1>Le mie recensioni ⭐</h1>

  <h3>Lascia una nuova recensione</h3>

  <label>Prodotto acquistato</label>
  <select id="selectProdotto">
    <option value="">Caricamento…</option>
  </select>

  <div id="stars" style="margin-top:10px;">
    <span data-v="1">★</span>
    <span data-v="2">★</span>
    <span data-v="3">★</span>
    <span data-v="4">★</span>
    <span data-v="5">★</span>
  </div>

  <textarea id="comment" placeholder="Scrivi qui la tua opinione…"></textarea>

  <button id="sendReview" class="btn btn-primary">Invia recensione</button>

  <div id="status" class="status"></div>

  <hr style="margin:30px 0;">

  <h3>Le tue recensioni</h3>
  <div id="listaRecensioni"></div>
</div>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>




         
         
         
         
         
         <script src="tracking.js"></script>
         
         
         
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- HEAD ADMIN DINAMICO -->
  <div id="head-admin-placeholder"></div>
</head>

<body>

  <!-- HEADER ADMIN DINAMICO -->
  <div id="header-admin-placeholder"></div>

  <main class="pagina-standard">

    <div class="dashboard-header">
      Dashboard Vendite – MewingMarket

      <button class="btn-secondario" onclick="location.reload()">Aggiorna</button>
      <button class="btn-secondario" onclick="location.href='../tracking.html'">Tracking</button>
    </div>

    <div class="dashboard-container">

      <!-- PERFORMANCE PRODOTTI -->
      <h2>Performance Prodotti</h2>
      <table class="dashboard-table" id="productsTable">
        <thead>
          <tr>
            <th>Prodotto</th>
            <th>Vendite</th>
            <th>Categoria</th>
            <th>Video</th>
            <th>Descrizione</th>
            <th>Qualità</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- TUTTE LE VENDITE -->
      <h2>Tutte le Vendite</h2>
      <table class="dashboard-table" id="salesTable">
        <thead>
          <tr>
            <th>Prodotto</th>
            <th>Prezzo</th>
            <th>Origine</th>
            <th>UTM</th>
            <th>Referrer</th>
            <th>Device</th>
            <th>Lingua</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- FEEDBACK -->
      <h2>Feedback Clienti</h2>
      <table class="dashboard-table" id="feedbackTable">
        <thead>
          <tr>
            <th>Prodotto</th>
            <th>Rating</th>
            <th>Commento</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </div>

  </main>

  <!-- FOOTER ADMIN DINAMICO -->
  <div id="footer-admin-placeholder"></div>

  <!-- JS GLOBALI ADMIN -->
  <script src="loader-admin.js"></script>
  <script src="seo-admin.js"></script>
  <script src="structured-data-admin.js"></script>

  <!-- JS SPECIFICO PAGINA -->
  <script src="js/dashboard-vendite.js"></script>

</body>
</html>

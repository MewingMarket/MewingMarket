<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS UNICO ADMIN -->
  <link rel="stylesheet" href="dashboard-admin.css">
</head>

<body class="dashboard-body">

<!-- HEAD DINAMICO -->
<div id="head-placeholder"></div>

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>

<main>

  <!-- SIDEBAR ADMIN -->
  <aside class="sidebar">
    <h2>Area Admin</h2>

    <div class="user-meta">
      <div id="adminEmail"></div>
      <div id="adminRole"></div>
    </div>
  </aside>

  <!-- PANEL PROFILO -->
  <section class="content" id="panel-profilo">
    <h1>Profilo Admin</h1>

    <p class="user-meta">
      Email: <span id="adminEmailMain"></span><br>
      Ruolo: <span id="adminRoleMain"></span>
    </p>

    <div class="field-group">
      <h3>Cambia email</h3>
      <label for="newAdminEmail">Nuova email</label>
      <input type="email" id="newAdminEmail" placeholder="Nuova email">
      <label for="passwordAdminEmail">Password attuale</label>
      <input type="password" id="passwordAdminEmail" placeholder="Password attuale">
      <button class="btn" id="btnAdminCambiaEmail">Aggiorna email</button>
      <div class="status" id="msgAdminEmail"></div>
    </div>

    <div class="field-group">
      <h3>Cambia password</h3>
      <label for="oldAdminPassword">Password attuale</label>
      <input type="password" id="oldAdminPassword" placeholder="Password attuale">
      <label for="newAdminPassword">Nuova password</label>
      <input type="password" id="newAdminPassword" placeholder="Nuova password">
      <button class="btn" id="btnAdminCambiaPassword">Aggiorna password</button>
      <div class="status" id="msgAdminPassword"></div>
    </div>
  </section>

  <!-- PANEL PRODOTTI -->
  <section class="content hidden" id="panel-prodotti">
    <h1>Prodotti</h1>
  </section>

  <!-- PANEL VENDITE -->
  <section class="content hidden" id="panel-vendite">
    <h1>Dashboard vendite</h1>
  </section>

  <!-- PANEL ORDINI -->
  <section class="content hidden" id="panel-ordini">
    <h1>Ordini</h1>
  </section>

  <!-- PANEL FEEDBACK -->
  <section class="content hidden" id="panel-feedback">
    <h1>Feedback</h1>
  </section>

  <!-- PANEL SETTINGS -->
  <section class="content hidden" id="panel-settings">
    <h1>Impostazioni</h1>
  </section>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>

<!-- JS -->
<script src="../loader-header-footer.js"></script>
<script src="dashboard-admin.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Gestione Prodotti | MewingMarket</title>
  </head>

<body>

  <div id="head-admin-placeholder"></div>

  <div id="header-admin-placeholder"></div>

  <main class="pagina-standard">

    <h1>Gestione Prodotti</h1>

    <section class="box-standard" id="sezione-lista">
      <h2>Prodotti esistenti</h2>

      <div id="lista-prodotti" class="catalogo-grid">
        <p>Caricamento prodotti...</p>
      </div>
    </section>

    <section class="box-standard" id="sezione-edit">

      <h2 id="titolo-form">Crea / Modifica Prodotto</h2>

      <div class="form-standard">

        <label for="titolo">Titolo Prodotto</label>
        <input type="text" id="titolo" placeholder="Esempio: Corso Mewing Avanzato">

        <label for="descrizione">Descrizione Completa</label>
        <textarea id="descrizione" rows="6" placeholder="Descrivi il prodotto nei dettagli..."></textarea>

        <div style="margin-bottom: 15px;">
          <button type="button" id="btn-ai-descrizione" class="btn-secondario">
            ✨ Genera descrizione con AI
          </button>
          <p id="ai-status" style="margin-top:8px; font-size:0.9rem; color:#666;"></p>
        </div>

        <div id="ai-preview-box" style="margin-bottom:20px; display:none;">
          <label>Anteprima Rendering AI</label>
          <div id="ai-preview" style="border:1px solid #ddd; padding:15px; border-radius:8px; font-size:0.95rem; background:#fafafa; min-height: 50px;"></div>
        </div>

        <input type="hidden" id="descrizione-breve">
        <input type="hidden" id="descrizione-email">

        <label for="prezzo" style="margin-top:15px;">Prezzo (€)</label>
        <input type="number" id="prezzo" step="0.01" placeholder="0.00">

        <label for="immagine">Immagine prodotto</label>
        <input type="file" id="immagine" accept="image/*">

        <label for="immagine-url" style="font-size: 0.8rem; color: #777;">Oppure incolla URL immagine:</label>
        <input type="url" id="immagine-url" placeholder="https://link-immagine.com/foto.jpg">

        <div style="text-align: center; margin: 10px 0;">
          <img id="preview-img" class="preview-img" style="max-width: 200px; display:none; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <label for="fileProdotto">File per l'utente (PDF / ZIP / Corso)</label>
        <input type="file" id="fileProdotto">

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <button id="btn-salva" class="btn-primario" style="width: 100%; padding: 15px; font-weight: bold;">
          SALVA PRODOTTO
        </button>

        <p id="status" style="margin-top:15px; text-align: center; font-weight: 500;"></p>

      </div>

    </section>

  </main>

  <div id="footer-admin-placeholder"></div>

  
  
  

<script src="/admin/loadersupremo-admin.js"></script>
</body>
</html>

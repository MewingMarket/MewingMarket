<!DOCTYPE html>
<html lang="it">
<head>

  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        })
        .catch(err => console.error("Errore caricamento head:", err));
    });
  </script>

  <title>Accedi — MewingMarket</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background:#f7faff;
      font-family:system-ui, sans-serif;
      color:#003366;
    }

    .login-box {
      max-width:400px;
      margin:60px auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
    }

    .login-box h1 {
      margin-bottom:10px;
      font-size:26px;
      color:#003366;
      text-align:center;
    }

    label {
      font-weight:600;
      margin-top:15px;
      display:block;
      color:#003366;
    }

    input {
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:8px;
      border:1px solid #cdd7e1;
      font-size:16px;
      background:white !important;
      color:#003366 !important;
    }

    input::placeholder {
      color:#7a8a9a !important;
    }

    button {
      width:100%;
      margin-top:20px;
      padding:12px;
      background:#0077ff;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover {
      background:#005fe0;
    }

    #status {
      margin-top:15px;
      font-size:14px;
      color:#d00;
      text-align:center;
      font-weight:600;
      min-height:20px;
    }

    .links {
      margin-top:20px;
      text-align:center;
      font-size:14px;
      line-height:1.6;
    }

    .links a {
      color:#0077ff;
      text-decoration:none;
      font-weight:600;
    }

    .links a:hover {
      text-decoration:underline;
    }
  </style>

</head>

<body>
<!-- AUTH GLOBALE -->
<script src="/auth.js"></script>

<!-- LOGICA HEADER SHOP -->
<script src="/header-shop.js"></script>

<!-- LOGICA FOOTER -->
<script src="/footer.js"></script>

<!-- TRACKING UNIVERSALE -->
<script src="/tracking.js"></script>


<script src="/structured-data.js"></script>
  
<!-- SEO DINAMICO -->
<script src="/seo.js"></script> 
<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("header.html")
      .then(r => r.text())
      .then(h => document.getElementById("header-placeholder").innerHTML = h)
      .catch(err => console.error("Errore caricamento header:", err));
  });
</script>

<main>

  <div class="login-box">
    <h1>Accedi</h1>

    <form id="login-form">
      <label>Email</label>
      <input type="email" name="email" placeholder="Inserisci la tua email" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Inserisci la password" required>

      <button type="submit">Accedi</button>
    </form>

    <div id="status"></div>

    <div class="links">
      <a href="reset-password.html">Hai dimenticato la password?</a><br>
      <a href="reset-email.html">Hai dimenticato l'email?</a><br>
      <a href="registrazione.html">Non hai un account? Registrati</a>
    </div>
  </div>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("footer.html")
      .then(r => r.text())
      .then(h => document.getElementById("footer-placeholder").innerHTML = h)
      .catch(err => console.error("Errore caricamento footer:", err));
  });
</script>

<script src="login.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MewingMarket | Dettaglio Prodotto</title>
  <link rel="stylesheet" href="header-shop.css">
  <link rel="stylesheet" href="prodotto.css">
  <link rel="stylesheet" href="catalogo.css"> 
  <style>
    /* Layout per video e descrizione */
    .video-container { 
      position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; 
      border-radius: 12px; background: #000; margin-top: 15px;
    }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    /* Spaziatura CTA finale */
    .cta-box.sotto-descrizione {
      margin-top: 40px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="head-placeholder"></div>
  <div id="header-placeholder"></div>

  <main id="page-product" class="pagina-standard">
    <section id="hero" class="hero-premium">
      <div class="hero-left">
        <img id="prodotto-immagine" src="/placeholder.webp" alt="Caricamento...">
      </div>

      <div class="hero-right">
        <h1 id="prodotto-titolo">Caricamento...</h1>
        <p id="prodotto-subtitle" class="subtitle"></p>
        
        <div class="price-box">
          <span id="prodotto-prezzo">--,--€</span>
        </div>
        
        <div class="trust-badges">
          <span>✔ Pagamento sicuro</span>
          <span>✔ Accesso immediato</span>
        </div>

        <div class="cta-box-hero" style="margin-top: 25px;">
          <button id="btn-acquista-hero" class="btn-primario" style="width: 100%;">
            Acquista Ora
          </button>
        </div>
      </div>
    </section>

    <section class="video-descrizione-wrapper">
      <div id="video-section" class="video-wrapper" style="display:none; margin-bottom: 40px;">
        <h2>Video Approfondimento</h2>
        <div class="video-container">
          <iframe id="prodotto-video" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>

      <div id="descrizione">
        <h2>Descrizione Completa</h2>
        <div id="prodotto-descrizione" class="testo-ai-content">
          <p>Recupero informazioni dal server...</p>
        </div>

        <div class="cta-box sotto-descrizione">
          <p style="margin-bottom: 15px; color: #666; font-size: 0.9em;">Hai dubbi? Consulta la nostra assistenza.</p>
          <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="btn-secondario">Torna su</button>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/loader.js?v=20260412"></script>
  <script src="/dynamic-loader.js?v=20260412"></script>
  
</body>
</html>

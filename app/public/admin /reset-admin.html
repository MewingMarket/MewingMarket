<!DOCTYPE html>
<html lang="it">
<head>

  <!-- HEAD ADMIN DINAMICO -->
  <script>
    
      fetch("head-admin.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        })
        .catch(err => console.error("Errore caricamento head-admin:", err));
    
  </script>

  <title>Reset Admin – MewingMarket</title>

  <style>
    body {
      background:#f7faff;
      font-family:system-ui, sans-serif;
      color:#003366;
    }
    .box {
      max-width:400px;
      margin:60px auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #cdd7e1;
      font-size:16px;
    }
    button {
      background:#0077ff;
      color:white;
      border:none;
      font-weight:600;
      cursor:pointer;
      transition:0.2s;
    }
    button:hover {
      background:#005fe0;
    }
    #msg {
      margin-top:15px;
      font-weight:600;
    }
  </style>

  <script defer>
    async function resetAdmin(e) {
      e.preventDefault();
      const msg = document.getElementById("msg");

      msg.textContent = "Invio richiesta...";
      msg.style.color = "#003366";

      try {
        const res = await fetch("/api/admin/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: "admin" })
        

        const data = await res.json();

        if (!data.success) {
          msg.textContent = data.error || "Errore reset";
          msg.style.color = "red";
          return;
        }

        msg.innerHTML = `
          <strong>Password temporanea generata:</strong><br>
          ${data.nuovaPassword}<br><br>
          <em>Aggiorna ADMIN_PASSWORD su Render.</em>
        `;
        msg.style.color = "green";

      } catch (err) {
        console.error(err);
        msg.textContent = "Errore server";
        msg.style.color = "red";
      }
    }

    
      document.getElementById("reset-admin-form")
        .addEventListener("submit", resetAdmin);
    
  </script>

</head>

<body>

<script src="auth.js"></script>
<script src="loader-header-footer.js"></script>
<script src="header-shop.js"></script>
<script src="footer.js"></script>
<script src="tracking.js"></script>
<script src="structured-data.js"></script>
<script src="seo.js"></script>





<script src="js/admin.js"></script>
<div class="box">
  <h1>Reset Password Admin</h1>

  <form id="reset-admin-form">
    <label>Email admin</label>
    <input type="email" value="admin" disabled>
    <button type="submit">Genera nuova password</button>
  </form>

  <p id="msg"></p>
</div>

<!-- FOOTER ADMIN DINAMICO -->
<div id="footer-admin-placeholder"></div>
<script>
  
    fetch("footer-admin.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("footer-admin-placeholder").innerHTML = html;
      })
      .catch(err => console.error("Errore caricamento footer-admin:", err));
  
</script>

</body>
</html>

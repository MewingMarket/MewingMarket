<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Diagnostica Route — MewingMarket</title>
<style>
  body { font-family: Arial; padding: 20px; background: #fafafa; }
  .box { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
</style>
</head>
<body>

<h1>Diagnostica Route — MewingMarket</h1>
<div id="output">Caricamento…</div>

<script>
(async () => {
  const routes = [
    "/api/prodotti",
    "/api/catalogo",
    "/api/recensioni-top",
    "/api/versione",
    "/api/me",
    "/api/utenti/evento",
    "/api/product-page",
    "/api/system-status",
    "/api/meta-feed",
    "/api/newsletter"
  ];

  const results = [];

  for (const url of routes) {
    try {
      const r = await fetch(url);
      const text = await r.text();
      results.push({ url, status: r.status, text });
    } catch (e) {
      results.push({ url, status: "ERR", text: e.message });
    }
  }

  document.getElementById("output").innerHTML =
    "<div class='box'><pre>" + JSON.stringify(results, null, 2) + "</pre></div>";
})();
</script>

</body>
</html>

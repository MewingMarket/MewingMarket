<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        })
        .catch(err => console.error("Errore caricamento head:", err));
    });
  </script>

  <script src="seo.js" defer></script>
  <script src="structured-data.js" defer></script>
  <script src="carrello.js" defer></script>

  <!-- CSS SPECIFICO PER LE PAGINE SHOP -->
  <link rel="stylesheet" href="catalogo.css">
  <link rel="stylesheet" href="shop.css">
</head>

<body>

<!-- HEADER SHOP -->
<div id="header-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("header-shop.html")
      .then(r => r.text())
      .then(h => {
        document.getElementById("header-placeholder").innerHTML = h;

        /* ================================
           ICONA CARRELLO + BADGE
        ================================= */
        const cartWrapper = document.createElement("div");
        cartWrapper.id = "cart-wrapper";

        const cartIcon = document.createElement("div");
        cartIcon.id = "cart-icon";
        cartIcon.innerHTML = "🛒";

        const cartBadge = document.createElement("div");
        cartBadge.id = "cart-badge";
        cartBadge.textContent = "0";

        cartWrapper.appendChild(cartIcon);
        cartWrapper.appendChild(cartBadge);

        cartWrapper.addEventListener("click", () => {
          window.location.href = "checkout.html";
        });

        const nav = document.querySelector("header nav");
        if (nav) nav.appendChild(cartWrapper);

        setTimeout(() => {
          if (typeof aggiornaBadgeCarrello === "function") {
            aggiornaBadgeCarrello();
          }
        }, 50);
      })
      .catch(err => console.error("Errore caricamento header-shop:", err));
  });
</script>

<main class="pagina-standard">

  <h1 class="center">Catalogo Prodotti Digitali</h1>

  <!-- CATEGORIE -->
  <div id="categorie" class="center"></div>

  <!-- FILTRI PREZZO -->
  <div class="center">
    <button class="btn" data-prezzo="10">Sotto i 10€</button>
    <button class="btn" data-prezzo="20">Sotto i 20€</button>
    <button class="btn" data-prezzo="30">Sotto i 30€</button>
    <button class="btn" id="reset">Tutti</button>
  </div>

  <!-- GRID CATALOGO -->
  <section id="catalogo" class="catalogo-grid"></section>

</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("footer.html")
      .then(r => r.text())
      .then(h => {
        document.getElementById("footer-placeholder").innerHTML = h;
      })
      .catch(err => console.error("Errore caricamento footer:", err));
  });
</script>

<script src="catalogo.js" defer></script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS SPECIFICO DASHBOARD -->
  <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard-body">

<!-- HEAD DINAMICO -->
<div id="head-placeholder"></div>

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>

<main>

  <aside class="sidebar">
    <h2>Area utente</h2>

    <div class="user-meta">
      <!-- 🔥 EMAIL → CODICE FISCALE -->
      <div id="sidebarCF"></div>
      <div id="sidebarUsername"></div>
    </div>

    <div style="margin-top:16px;">
      <div class="nav-item" id="nav-profilo">Modifica profilo</div>
      <div class="nav-item" id="nav-download">Download</div>
      <div class="nav-item" id="nav-ordini">I miei ordini</div>
      <div class="nav-item" id="nav-logout">Logout</div>
      <div class="nav-item danger" id="nav-elimina">Elimina account</div>
    </div>

    <div class="nav-site">
      <a href="/">← Torna al sito</a>
    </div>
  </aside>

  <section class="content" id="content-profilo">
    <h1>Profilo utente</h1>

    <p class="user-meta">
      <!-- 🔥 EMAIL → CODICE FISCALE -->
      Codice fiscale: <span id="userCF"></span><br>
      Username: <span id="username"></span>
    </p>

    <div class="field-group">
      <h3>Cambia email</h3>
      <label for="newEmail">Nuova email</label>
      <input type="email" id="newEmail" placeholder="Nuova email">
      <label for="passwordEmail">Password attuale</label>
      <input type="password" id="passwordEmail" placeholder="Password attuale">
      <button class="btn btn-primary" id="btnCambiaEmail">Aggiorna email</button>
      <div class="status" id="msgEmail"></div>
    </div>

    <div class="field-group">
      <h3>Cambia password</h3>
      <label for="oldPassword">Password attuale</label>
      <input type="password" id="oldPassword" placeholder="Password attuale">
      <label for="newPassword">Nuova password</label>
      <input type="password" id="newPassword" placeholder="Nuova password">
      <button class="btn btn-primary" id="btnCambiaPassword">Aggiorna password</button>
      <div class="status" id="msgPassword"></div>
    </div>

    <div class="field-group">
      <h3>Elimina account</h3>
      <p>Questa azione è irreversibile. Tutti i tuoi dati verranno eliminati.</p>
      <label for="passwordDelete">Conferma password</label>
      <input type="password" id="passwordDelete" placeholder="Password per confermare">
      <button class="btn btn-danger" id="btnEliminaAccount">Elimina account</button>
      <div class="status" id="msgElimina"></div>
    </div>
  </section>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>

<!-- JS GLOBALI -->
<script src="loader-header-footer.js"></script>
<script src="dashboard.js"></script>
<script src="seo.js"></script>
<script src="structured-data.js"></script>
<script src="tracking.js"></script>

</body>
</html>

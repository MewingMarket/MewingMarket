<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="header-shop.css">
  <link rel="stylesheet" href="prodotto.css">
</head>

<body>

<!-- HEAD DINAMICO -->
<div id="head-placeholder"></div>

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>

<main id="page-product">

  <!-- HERO -->
  <section id="hero" class="hero-premium">
    <div class="hero-left">
      <img id="product-image" src="" alt="Prodotto">
    </div>

    <div class="hero-right">
      <h1 id="product-title"></h1>
      <p id="product-subtitle" class="subtitle"></p>

      <div class="price-box">
        <span id="product-price"></span>
      </div>

      <div class="trust-badges">
        <span>✔ Pagamento sicuro</span>
        <span>✔ Accesso immediato</span>
        <span>✔ Supporto incluso</span>
      </div>
    </div>
  </section>

  <!-- VIDEO + DESCRIZIONE -->
  <section class="video-descrizione-wrapper">

    <div id="video-section" class="video-wrapper" style="display:none;">
      <iframe id="product-video" allowfullscreen></iframe>
    </div>

    <div id="descrizione">
      <h2>Descrizione</h2>
      <div id="product-description"></div>

      <div class="cta-box sotto-descrizione">
        <button id="btn-acquista" class="btn-primario">Acquista ora</button>
        <button id="btn-carrello" class="btn-secondario">Aggiungi al carrello</button>
        <button id="btn-remove-cart" class="btn-secondario">Rimuovi dal carrello</button>
      </div>
    </div>

  </section>

  <!-- CORRELATI -->
  <section class="related-section">
    <h2>Potrebbe interessarti anche</h2>
    <div class="catalogo-grid" id="related"></div>
  </section>

</main>

<div id="footer-placeholder"></div>

<!-- JS SPECIFICO -->
<script src="prodotto.js?v=20260412"></script>

<!-- GLOBALI (solo loader con versioning) -->
<script src="loader.js?v=20260412"></script>
    <script src="/dynamic-loader.js?v=20260412"></script>
  

</body>
</html>

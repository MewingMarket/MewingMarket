<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Prodotti | MewingMarket</title>
  
  <link rel="stylesheet" href="./header-shop.css">
  <link rel="stylesheet" href="./catalogo.css">
</head>
<body class="pagina-standard-body">

  <div id="head-placeholder"></div>
  <div id="header-placeholder"></div>

  <main class="pagina-standard">
    <h1>Catalogo Prodotti</h1>
    
    <section class="filtri-catalogo">
      <div id="categorie" class="categorie-box"></div>
      
      <div class="filtri-prezzo">
        <button class="btn-filtro" data-prezzo="10">Fino a 10€</button>
        <button class="btn-filtro" data-prezzo="20">Fino a 20€</button>
        <button class="btn-filtro" data-prezzo="50">Fino a 50€</button>
        <button class="btn-filtro" id="reset">Tutti i prezzi</button>
      </div>
    </section>

    <section id="grid-prodotti" class="catalogo-grid">
      <p class="loading-text">Caricamento prodotti in corso...</p>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  
  
  

<script src="/loadersupremo.js"></script>
<script src="/catalogo.js?v=2050"></script>

</body>
</html>

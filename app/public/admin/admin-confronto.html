<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confronto Prodotti | Admin</title>
</head>

<body>

  <div id="head-admin-placeholder"></div>
  <div id="header-admin-placeholder"></div>

  <main class="dashboard-container">

    <h1 class="page-title">Confronto Prodotti</h1>

    <!-- ========================================================= -->
    <!-- SEZIONE FILTRI -->
    <!-- ========================================================= -->
    <section class="box-standard" style="margin-bottom:30px;">
      <h2>Filtri</h2>

      <div class="form-standard">

        <label for="filtro-testo">Cerca prodotto</label>
        <input type="text" id="filtro-testo" placeholder="Titolo, categoria, ID...">

        <label for="filtro-tipo">Tipo</label>
        <select id="filtro-tipo">
          <option value="tutti">Tutti</option>
          <option value="validazioni">Validazioni</option>
          <option value="da-creare">Prodotti da creare (AI)</option>
          <option value="pubblicati">Prodotti pubblicati</option>
        </select>

        <button id="btn-filtra" class="btn-primario" style="margin-top:15px;">
          🔍 Applica Filtri
        </button>

      </div>
    </section>

    <!-- ========================================================= -->
    <!-- SEZIONE RISULTATI -->
    <!-- ========================================================= -->
    <section class="box-standard">
      <h2>Risultati</h2>

      <div id="confronto-container" class="catalogo-grid">
        <p>Caricamento dati...</p>
      </div>
    </section>

    <!-- ========================================================= -->
    <!-- SEZIONE DETTAGLIO -->
    <!-- ========================================================= -->
    <section id="dettaglio-box" class="box-standard" style="display:none;margin-top:30px;">
      <h2 id="dettaglio-titolo">Dettaglio</h2>

      <div class="kpi-grid">

        <div class="kpi-card">
          <h3>Tipo</h3>
          <p id="det-tipo">—</p>
        </div>

        <div class="kpi-card">
          <h3>Categoria</h3>
          <p id="det-categoria">—</p>
        </div>

        <div class="kpi-card">
          <h3>Prezzo</h3>
          <p id="det-prezzo">—</p>
        </div>

        <div class="kpi-card">
          <h3>Trend Score</h3>
          <p id="det-trend">—</p>
        </div>

      </div>

      <div class="box-standard" style="margin-top:20px;">
        <h3>Descrizione / Note</h3>
        <p id="det-descrizione" style="white-space:pre-line;"></p>
      </div>

    </section>

  </main>

  <div id="footer-admin-placeholder"></div>

  <!-- 🔥 UNICO SCRIPT CONSENTITO -->
  <script src="/admin/loadersupremo-admin.js"></script>

</body>
</html>

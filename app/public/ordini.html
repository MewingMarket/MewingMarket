<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>I miei ordini — MewingMarket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        });
    });
  </script>

  <link rel="stylesheet" href="style.css">

  <style>
    body { background:#f7faff; margin:0; font-family:system-ui; color:#003366; }
    .box {
      max-width:1000px; margin:40px auto; background:white;
      padding:25px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.06);
    }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { padding:12px; border-bottom:1px solid #eee; vertical-align:top; }

    .btn-cancel {
      padding:6px 12px; background:#ff4444; color:white;
      border:none; border-radius:6px; cursor:pointer;
      margin-top:6px; display:inline-block;
    }
    .btn-cancel:hover { background:#e63a3a; }

    /* BOTTONI DI NAVIGAZIONE */
    .nav-box {
      margin-top:30px;
      text-align:center;
    }
    .nav-btn {
      display:inline-block;
      margin:8px;
      padding:10px 18px;
      background:#0057ff;
      color:white;
      border-radius:6px;
      text-decoration:none;
      font-size:15px;
    }
    .nav-btn:hover {
      background:#003fcc;
    }
  </style>
</head>

<body>

<script src="auth.js"></script>
<script src="header-shop.js"></script>
<script src="footer.js"></script>
<script src="tracking.js"></script>
<script src="structured-data.js"></script>
<script src="seo.js"></script>

  <!-- 🔵 BOTTONI DI NAVIGAZIONE -->

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("footer.html")
      .then(r => r.text())

</script>

<script src="ordini.js"></script>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- HEAD ADMIN DINAMICO -->
  <div id="head-admin-placeholder"></div>
</head>

<body>

  <!-- HEADER ADMIN DINAMICO -->
  <div id="header-admin-placeholder"></div>

  <main class="pagina-standard">

    <h1>Analisi Performance</h1>

    <!-- METRICHE PRINCIPALI -->
    <section class="box-standard">
      <h2>Panoramica</h2>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Conversion Rate</h3>
          <p id="conv-rate">—</p>
        </div>

        <div class="stat-card">
          <h3>Traffico Totale</h3>
          <p id="traffico-totale">—</p>
        </div>

        <div class="stat-card">
          <h3>CTR Medio</h3>
          <p id="ctr-medio">—</p>
        </div>
      </div>
    </section>

    <!-- ANALISI PER PRODOTTO -->
    <section class="box-standard">
      <h2>Analisi per prodotto</h2>

      <table class="tabella-standard" id="tabella-analisi-prodotti">
        <thead>
          <tr>
            <th>Prodotto</th>
            <th>Visite</th>
            <th>Aggiunte al carrello</th>
            <th>Vendite</th>
            <th>Conversione</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ANALISI TRAFFICO -->
    <section class="box-standard">
      <h2>Analisi traffico</h2>

      <table class="tabella-standard" id="tabella-traffico">
        <thead>
          <tr>
            <th>Origine</th>
            <th>Visite</th>
            <th>CTR</th>
            <th>Conversione</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ANALISI UTM -->
    <section class="box-standard">
      <h2>Analisi UTM</h2>

      <table class="tabella-standard" id="tabella-utm">
        <thead>
          <tr>
            <th>Campagna</th>
            <th>Visite</th>
            <th>Vendite</th>
            <th>Conversione</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </main>

  <!-- FOOTER ADMIN DINAMICO -->
  <div id="footer-admin-placeholder"></div>

  <!-- JS GLOBALI ADMIN -->
  <script src="loader-admin.js"></script>
  <script src="seo-admin.js"></script>
  <script src="structured-data-admin.js"></script>

  <!-- JS SPECIFICO PAGINA -->
  <script src="js/analisi.js"></script>

</body>
</html>

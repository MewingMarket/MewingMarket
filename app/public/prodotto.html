<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dettaglio Prodotto | MewingMarket</title>

  <link rel="stylesheet" href="header-shop.css">
  <link rel="stylesheet" href="prodotto.css">
  <link rel="stylesheet" href="catalogo.css"> </head>

<body>

  <div id="head-placeholder"></div>

  <div id="header-placeholder"></div>

  <main id="page-product" class="pagina-standard">

    <section id="hero" class="hero-premium">
      <div class="hero-left">
        <img id="product-image" src="/placeholder.webp" alt="Caricamento prodotto...">
      </div>

      <div class="hero-right">
        <h1 id="product-title">Caricamento...</h1>
        <p id="product-subtitle" class="subtitle"></p>

        <div class="price-box">
          <span id="product-price">--,--€</span>
        </div>

        <div class="trust-badges">
          <span>✔ Pagamento sicuro</span>
          <span>✔ Accesso immediato</span>
          <span>✔ Supporto incluso</span>
        </div>

        <div class="cta-box-hero" style="margin-top: 25px; display: flex; gap: 10px;">
          <button id="btn-acquista-hero" class="btn-primario" onclick="document.getElementById('btn-acquista').click()">
            Acquista Ora
          </button>
        </div>
      </div>
    </section>

    <section class="video-descrizione-wrapper">

      <div id="video-section" class="video-wrapper" style="display:none;">
        <h2>Video Approfondimento</h2>
        <iframe id="product-video" frameborder="0" allowfullscreen></iframe>
      </div>

      <div id="descrizione">
        <h2>Descrizione Completa</h2>
        <div id="product-description" class="testo-ai-content"></div>

        <div class="cta-box sotto-descrizione">
          <button id="btn-acquista" class="btn-primario">Procedi al pagamento</button>
          <button id="btn-carrello" class="btn-secondario">Aggiungi al carrello</button>
          <button id="btn-remove-cart" class="btn-secondario">Rimuovi (-1)</button>
        </div>
      </div>

    </section>

    <section class="related-section">
      <hr style="border: 0; border-top: 1px solid #eee; margin: 40px 0;">
      <h2>Potrebbe interessarti anche</h2>
      <div class="catalogo-grid" id="related">
        </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script src="/loader.js?v=20260412" type="text/javascript" crossorigin="anonymous"></script>
  <script src="/dynamic-loader.js?v=20260412" type="text/javascript" crossorigin="anonymous"></script>
  
  <script src="/carrello.js?v=20260412" type="text/javascript"></script>
  
  <script src="/prodotto.js?v=20260412" type="text/javascript" charset="UTF-8" crossorigin="anonymous"></script>

</body>
</html>

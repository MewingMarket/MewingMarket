<!DOCTYPE html>
<html lang="it">
<head>
  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        })
        .catch(err => console.error("Errore caricamento head:", err));
    });
  </script>

  <title>Dashboard — MewingMarket</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin:0;
      background:#f7faff;
      font-family:system-ui, sans-serif;
      color:#003366;
    }
    main {
      max-width:1100px;
      margin:40px auto;
      display:flex;
      gap:24px;
    }
    .sidebar {
      width:260px;
      background:white;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
      padding:20px;
    }
    .sidebar h2 {
      margin-top:0;
      font-size:20px;
    }
    .nav-item {
      padding:10px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      margin-top:6px;
    }
    .nav-item:hover {
      background:#eef4ff;
    }
    .nav-item.danger {
      color:#cc0000;
    }
    .content {
      flex:1;
      background:white;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
      padding:24px;
    }
    .content h1 {
      margin-top:0;
      font-size:24px;
    }
    .field-group {
      margin-top:18px;
    }
    .field-group label {
      display:block;
      font-size:14px;
      margin-bottom:6px;
    }
    .field-group input {
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid #cdd7e1;
      font-size:15px;
    }
    .btn {
      margin-top:16px;
      padding:10px 16px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-size:15px;
      font-weight:600;
    }
    .btn-primary {
      background:#0077ff;
      color:white;
    }
    .btn-primary:hover {
      background:#005fe0;
    }
    .btn-danger {
      background:#ff4444;
      color:white;
    }
    .btn-danger:hover {
      background:#e63a3a;
    }
    .status {
      margin-top:12px;
      font-size:14px;
      font-weight:600;
    }
    .status.ok {
      color:#4ade80;
    }
    .status.err {
      color:#f97373;
    }
    .user-meta {
      font-size:14px;
      color:#335;
      margin-top:4px;
    }

    .nav-site {
      margin-top:20px;
      text-align:center;
    }
    .nav-site a {
      display:inline-block;
      padding:10px 16px;
      background:#0057ff;
      color:white;
      border-radius:8px;
      text-decoration:none;
      font-size:14px;
    }
    .nav-site a:hover {
      background:#003fcc;
    }
  </style>
</head>

<body>











<!-- AUTH GLOBALE -->

<!-- LOGICA HEADER SHOP -->

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
      .then(r => r.text())
      .then(h => document.getElementById("header-placeholder").innerHTML = h)
      .catch(err => console.error("Errore caricamento header:", err));
  });
</script>

<main>

  <aside class="sidebar">
    <h2>Area utente</h2>
    <div class="user-meta">
      <div id="sidebarEmail"></div>
      <div id="sidebarUsername"></div>
    </div>

    <div style="margin-top:16px;">
      <div class="nav-item" id="nav-profilo">Modifica profilo</div>
      <div class="nav-item" id="nav-download">Download</div>
      <div class="nav-item" id="nav-ordini">I miei ordini</div>
      <div class="nav-item" id="nav-logout">Logout</div>
      <div class="nav-item danger" id="nav-elimina">Elimina account</div>
    </div>

    <div class="nav-site">
      <a href="/">← Torna al sito</a>
    </div>
  </aside>

  <section class="content" id="content-profilo">
    <h1>Profilo utente</h1>
    <p class="user-meta">
      Email: <span id="userEmail"></span><br>
      Username: <span id="username"></span>
    </p>

    <div class="field-group">
      <h3>Cambia email</h3>
      <label for="newEmail">Nuova email</label>
      <input type="email" id="newEmail" placeholder="Nuova email">
      <label for="passwordEmail">Password attuale</label>
      <input type="password" id="passwordEmail" placeholder="Password attuale">
      <button class="btn btn-primary" id="btnCambiaEmail">Aggiorna email</button>
      <div class="status" id="msgEmail"></div>
    </div>

    <div class="field-group">
      <h3>Cambia password</h3>
      <label for="oldPassword">Password attuale</label>
      <input type="password" id="oldPassword" placeholder="Password attuale">
      <label for="newPassword">Nuova password</label>
      <input type="password" id="newPassword" placeholder="Nuova password">
      <button class="btn btn-primary" id="btnCambiaPassword">Aggiorna password</button>
      <div class="status" id="msgPassword"></div>
    </div>

    <div class="field-group">
      <h3>Elimina account</h3>
      <p>Questa azione è irreversibile. Tutti i tuoi dati verranno eliminati.</p>
      <label for="passwordDelete">Conferma password</label>
      <input type="password" id="passwordDelete" placeholder="Password per confermare">
      <button class="btn btn-danger" id="btnEliminaAccount">Elimina account</button>
      <div class="status" id="msgElimina"></div>
    </div>
  </section>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
      .then(r => r.text())
      .then(h => document.getElementById("footer-placeholder").innerHTML = h)
      .catch(err => console.error("Errore caricamento footer:", err));
  });
</script>

<script src="dashboard.js"></script>

         <script src="footer.js"></script>
         <script src="tracking.js"></script>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Diagnostica /var/data</title>
  <style>
    body { background:#111; color:#eee; font-family:monospace; padding:20px; }
    pre { background:#000; padding:10px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Diagnostica /var/data</h1>
  <div id="out">Caricamento…</div>

  <script>
    fetch("/diagnostica/var-data")
      .then(r => r.json())
      .then(data => {
        document.getElementById("out").innerHTML =
          "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
      })
      .catch(err => {
        document.getElementById("out").innerHTML =
          "<pre>Errore: " + err.message + "</pre>";
      });
  </script>
    <script src="/dynamic-loader.js?v=20260412"></script>
  
</body>
</html>

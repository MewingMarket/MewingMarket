<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Profilo Utente</title>
  <link rel="stylesheet" href="profilo.css">
</head>
<body>

<div class="profile-container">

  <!-- HEADER PROFILO -->
  <div class="profile-header">

    <div class="profile-info">
      <h2 id="userEmail"></h2>
      <p class="joined">Registrato il: <span id="dataRegistrazione">--</span></p>
    </div>

  </div>

  <!-- SEZIONI -->
  <div class="profile-sections">

    <!-- CAMBIO EMAIL -->
    <div class="card">
      <h3>Cambia Email</h3>
      <input type="email" id="newEmail" placeholder="Nuova email">
      <button id="btnCambiaEmail">Aggiorna email</button>
      <p class="msg" id="msgEmail"></p>
    </div>

    <!-- CAMBIO PASSWORD -->
    <div class="card">
      <h3>Cambia Password</h3>
      <input type="password" id="oldPassword" placeholder="Password attuale">
      <input type="password" id="newPassword" placeholder="Nuova password">
      <button id="btnCambiaPassword">Aggiorna password</button>
      <p class="msg" id="msgPassword"></p>
    </div>

    <!-- ELIMINA ACCOUNT -->
    <div class="card danger">
      <h3>Elimina Account</h3>
      <p>Questa azione è irreversibile.</p>
      <button id="btnEliminaAccount" class="danger-btn">Elimina account</button>
      <p class="msg" id="msgElimina"></p>
    </div>

  </div>

</div>

<script src="profilo.js"></script>
</body>
</html>

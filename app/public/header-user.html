<!-- HEADER USER – STRUTTURA PULITA E DINAMICA -->

<div class="user-header">
  <div class="user-header-inner">

    <!-- LOGO -->
    <a href="index.html" class="logo">
      <img src="logo.png" alt="MewingMarket" width="160">
    </a>

    <!-- NAV UTENTE -->
    <nav class="user-nav">
      <a href="dashboard.html" id="user-dashboard">Dashboard</a>
      <a href="#" id="user-logout">Logout</a>
    </nav>

  </div>
</div>

<script>
  document.addEventListener("header-loaded", () => {

    const dashboardBtn = document.getElementById("user-dashboard");
    const logoutBtn = document.getElementById("user-logout");

    function aggiornaHeaderUser() {
      const logged = window.isLogged;

      if (!logged) {
        // Se non loggato → redirect automatico
        location.href = "login.html?redirect=dashboard.html";
        return;
      }

      // Se loggato → mostra tutto
      dashboardBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
    }

    // Aggiorna quando auth.js è pronto
    document.addEventListener("auth-ready", aggiornaHeaderUser);

    // Logout
    logoutBtn.addEventListener("click", e => {
      e.preventDefault();
      logout();
      location.href = "index.html";
    });
  });
</script>

<!DOCTYPE html>
<html lang="it">
<head>

  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        })
        .catch(err => console.error("Errore caricamento head:", err));
    });
  </script>

  <title>Accedi — MewingMarket</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background:#f7faff;
      font-family:system-ui, sans-serif;
      color:#003366;
    }
    .login-box {
      max-width:400px;
      margin:60px auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
    }
    input {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #cdd7e1;
      font-size:16px;
    }
    button {
      width:100%;
      margin-top:20px;
      padding:12px;
      background:#0077ff;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      font-weight:600;
      transition:0.2s;
    }
    button:hover {
      background:#005fe0;
    }
    #status {
      margin-top:15px;
      font-size:14px;
      color:#d00;
      text-align:center;
      font-weight:600;
    }
    .links {
      margin-top:20px;
      text-align:center;
      font-size:14px;
    }
    .links a, .link-switch {
      color:#0077ff;
      text-decoration:none;
      font-weight:600;
      cursor:pointer;
      display:block;
      margin-top:10px;
    }
    .link-danger {
      color:#cc0000 !important;
    }
  </style>

</head>

<body>

<!-- HEADER DINAMICO -->
<div id="header-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("header.html")
      .then(r => r.text())
      .then(h => document.getElementById("header-placeholder").innerHTML = h)
      .catch(err => console.error("Errore caricamento header:", err));
  });
</script>

<main>

  <div class="login-box">
    <h1>Accedi</h1>

    <form id="login-form">
      <label>Email</label>
      <input type="email" name="email" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <button type="submit">Accedi</button>
    </form>

    <div id="status"></div>

    <div class="links">

      <!-- LINK CAMBIO CREDENZIALI -->
      <span id="link-cambia-email" class="link-switch">Cambia Email</span>
      <span id="link-cambia-password" class="link-switch">Cambia Password</span>

      <!-- ELIMINAZIONE ACCOUNT -->
      <span id="link-elimina-account" class="link-switch link-danger">Elimina Account</span>

      <!-- REGISTRAZIONE -->
      <p style="margin-top:20px;">
        <a href="registrazione.html">Non hai un account? Registrati qui</a>
      </p>

    </div>
  </div>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("footer.html")
      .then(r => r.text())
      .then(h => document.getElementById("footer-placeholder").innerHTML = h)
      .catch(err => console.error("Errore caricamento footer:", err));
  });
</script>

<script src="login.js"></script>

</body>
</html>

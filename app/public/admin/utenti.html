<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="dynamic-title" content="Gestione Utenti – Admin MewingMarket">
  <title>Gestione Utenti – Admin</title>

  <link rel="stylesheet" href="dashboard-admin.css">
</head>

<body>

  <div id="head-admin-placeholder"></div>
  <div id="header-admin-placeholder"></div>

  <main class="pagina-standard">

    <h1>Gestione Utenti</h1>

    <!-- ⭐ KPI SECTION -->
    <section class="box-standard" id="kpi-utenti">
      <h2>KPI Utenti</h2>
      <div id="kpi-container" class="kpi-grid">
        <!-- KPI generati da admin-utenti.js -->
      </div>
    </section>

    <section class="box-standard">

      <!-- ⭐ TOOLBAR UTENTI -->
      <div class="toolbar-utenti">

        <button id="btn-sync-brevo" class="btn-primario">
          Sincronizza Brevo
        </button>

        <button id="btn-sync-brevo-full" class="btn-secondario">
          Sync Utenti Storici
        </button>

      </div>

      <table class="tabella-standard" id="tabella-utenti">
        <thead>
          <tr>
            <th>Email</th>
            <th>Codice Fiscale</th>

            <th>Registrato</th>
            <th>Login</th>
            <th>Logout</th>
            <th>Eliminato</th>
            <th>Bloccato</th>
            <th>Sbloccato</th>
            <th>Bannato</th>

            <th>Iscritto NL</th>
            <th>Disiscritto NL</th>

            <th>Registrato in Brevo</th>
            <th>Cliente Brevo</th>

            <th>Azioni</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </section>

  </main>

  <div id="footer-admin-placeholder"></div>

  <!-- ========================================================= -->
  <!-- 🔥 SCRIPTS FINALI (UNICI E STANDARDIZZATI) -->
  <!-- ========================================================= -->
  <script type="module" src="/admin/loadersupremo-admin.js?v=2050"></script>
  <script src="/admin/admin-utenti.js?v=2050"></script>

</body>
</html>

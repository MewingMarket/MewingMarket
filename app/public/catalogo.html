<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HEAD DINAMICO -->
  <div id="head-placeholder"></div>

  <!-- CSS SPECIFICI -->
  <link rel="stylesheet" href="header-shop.css">
  <link rel="stylesheet" href="catalogo.css">
  <link rel="stylesheet" href="footer.css">
</head>

<body>

<!-- HEADER SHOP DINAMICO -->
<div id="header-placeholder"></div>

<main class="pagina-standard">

  <h1>Catalogo Prodotti</h1>

  <!-- FILTRI -->
  <section class="filtri-catalogo">

    <!-- CATEGORIE DINAMICHE -->
    <div id="categorie"></div>

    <!-- FILTRI PREZZO -->
    <div class="filtri-prezzo">
      <button class="btn" data-prezzo="10">Fino a 10€</button>
      <button class="btn" data-prezzo="20">Fino a 20€</button>
      <button class="btn" data-prezzo="50">Fino a 50€</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </section>

  <!-- GRID PRODOTTI -->
  <section id="catalogo" class="catalogo-grid"></section>

</main>

<!-- FOOTER DINAMICO -->
<div id="footer-placeholder"></div>

<!-- JS SHOP OBBLIGATORI -->
<script src="carello.js"></script>
<script src="auth.js"></script>
<script src="header-shop.js"></script>

<!-- JS SPECIFICO CATALOGO -->
<script src="catalogo.js"></script>

<!-- JS GLOBALI -->
<script src="loader-header-footer.js"></script>
<script src="seo.js"></script>
<script src="structured-data.js"></script>
<script src="tracking.js"></script>

</body>
</html>

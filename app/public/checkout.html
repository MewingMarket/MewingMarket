<!DOCTYPE html>
<html lang="it">
<head>

  <!-- HEAD DINAMICO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("head.html")
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          [...temp.children].forEach(node => document.head.appendChild(node));
        })
        .catch(err => console.error("Errore caricamento head:", err));
    });
  </script>

  <title>Checkout – MewingMarket</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shop.css">

  <!-- JS -->
  <script src="carrello.js" defer></script>
  <script src="checkout.js" defer></script>

</head>

<body>

<script src="auth.js"></script>
<script src="loader-header-footer.js"></script>
<script src="header-shop.js"></script>
<script src="footer.js"></script>
<script src="tracking.js"></script>
<script src="structured-data.js"></script>
<script src="seo.js"></script>

<!-- HEADER SHOP -->
<div id="header-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("header-shop.html")
      .then(r => r.text())
      .then(h => {
        document.getElementById("header-placeholder").innerHTML = h;

        /* ================================
           ICONA CARRELLO + BADGE
        ================================= */
        const cartWrapper = document.createElement("div");
        cartWrapper.id = "cart-wrapper";

        const cartIcon = document.createElement("div");
        cartIcon.id = "cart-icon";
        cartIcon.innerHTML = "🛒";

        const cartBadge = document.createElement("div");
        cartBadge.id = "cart-badge";
        cartBadge.textContent = "0";

        cartWrapper.appendChild(cartIcon);
        cartWrapper.appendChild(cartBadge);

        cartWrapper.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const nav = document.querySelector("header nav");
        if (nav) nav.appendChild(cartWrapper);

        if (typeof aggiornaBadgeCarrello === "function") {
          aggiornaBadgeCarrello();
        }
      })
      .catch(err => console.error("Errore caricamento header-shop:", err));
  });
</script>

<main class="pagina-standard">

  <h1>Checkout</h1>

  <div id="stats" class="box-standard">
    <p><strong>Totale carrello:</strong> <span id="totale"></span>€</p>
    <p><strong>Da pagare:</strong> <span id="da-pagare"></span>€</p>
  </div>

  <table id="checkout-table" class="tabella-standard">
    <thead>
      <tr>
        <th>Prodotto</th>
        <th>Prezzo</th>
        <th>Quantità</th>
        <th>Subtotale</th>
        <th>Rimuovi</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div style="margin-top: 25px; text-align:center;">
    <button id="btn-paga" class="btn-primario">Procedi al pagamento</button>
  </div>

</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
      .then(r => r.text())
      .then(h => {
        document.getElementById("footer-placeholder").innerHTML = h;
      })
      .catch(err => console.error("Errore caricamento footer:", err));
  });
</script>

</body>
</html>

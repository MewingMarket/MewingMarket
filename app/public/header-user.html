<!-- HEADER USER – STRUTTURA PULITA E DINAMICA -->

<div class="user-header">
  <div class="user-header-inner">

    <!-- LOGO -->
    <a href="index.html" class="logo">
      <img src="logo.png" alt="MewingMarket" width="160">
    </a>

    <!-- NAV UTENTE -->
    <nav class="user-nav">
      <a href="dashboard.html" id="user-dashboard">Dashboard</a>
      <a href="#" id="user-logout">Logout</a>
    </nav>

  </div>
</div>

<script>
  document.addEventListener("header-loaded", () => {
    const logoutBtn = document.getElementById("user-logout");

    if (logoutBtn) {
      logoutBtn.addEventListener("click", e => {
        e.preventDefault();
        logout(); // funzione già presente in auth.js
        location.href = "index.html";
      });
    }
  });
</script>

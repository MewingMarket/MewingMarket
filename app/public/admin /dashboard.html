<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- HEAD ADMIN DINAMICO -->
  <div id="head-admin-placeholder"></div>
</head>

<body>

  <!-- HEADER ADMIN DINAMICO -->
  <div id="header-admin-placeholder"></div>

  <main class="pagina-standard">

    <h1>Dashboard Admin</h1>

    <!-- METRICHE PRINCIPALI -->
    <section class="box-standard">
      <h2>Panoramica</h2>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Vendite totali</h3>
          <p id="stat-vendite">—</p>
        </div>

        <div class="stat-card">
          <h3>Ordini totali</h3>
          <p id="stat-ordini">—</p>
        </div>

        <div class="stat-card">
          <h3>Prodotti attivi</h3>
          <p id="stat-prodotti">—</p>
        </div>
      </div>
    </section>

    <!-- ULTIMI ORDINI -->
    <section class="box-standard">
      <h2>Ultimi ordini</h2>

      <table class="tabella-standard" id="tabella-ultimi-ordini">
        <thead>
          <tr>
            <th>Data</th>
            <th>Prodotto</th>
            <th>Prezzo</th>
            <th>Utente</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- PULSANTI RAPIDI -->
    <section class="box-standard">
      <h2>Azioni rapide</h2>

      <div class="quick-actions">
        <a href="prodotti.html" class="btn">Gestisci prodotti</a>
        <a href="vendite.html" class="btn">Vedi vendite</a>
        <a href="ordini.html" class="btn">Vedi ordini</a>
        <a href="feedback.html" class="btn">Feedback clienti</a>
        <a href="analisi.html" class="btn">Analisi performance</a>
        <a href="settings.html" class="btn">Impostazioni</a>
      </div>
    </section>

  </main>

  <!-- FOOTER ADMIN DINAMICO -->
  <div id="footer-admin-placeholder"></div>

  <!-- JS GLOBALI ADMIN -->
  <script src="loader-admin.js"></script>
  <script src="seo-admin.js"></script>
  <script src="structured-data-admin.js"></script>

  <!-- JS SPECIFICO PAGINA -->
  <script src="js/>dashboard-admin.js"</script>
</body>
</html>

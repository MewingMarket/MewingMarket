<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="dashboard-admin.css">
</head>

<body>

  <!-- HEAD ADMIN DINAMICO -->
  <div id="head-admin-placeholder"></div>

  <!-- HEADER ADMIN DINAMICO -->
  <div id="header-admin-placeholder"></div>

  <main class="pagina-standard">

    <h1>Gestione Prodotti</h1>

    <!-- ================================
         SEZIONE LISTA PRODOTTI (SOPRA)
    ================================= -->
    <section class="box-standard" id="sezione-lista">
      <h2>Prodotti esistenti</h2>

      <div id="lista-prodotti" class="catalogo-grid">
        <!-- Riempito da admin-prodotti.js -->
      </div>
    </section>

    <!-- ================================
         SEZIONE EDIT / CREA PRODOTTO (SOTTO)
    ================================= -->
    <section class="box-standard" id="sezione-edit">

      <h2 id="titolo-form">Crea / Modifica Prodotto</h2>

      <div class="form-standard">

        <!-- TITOLO -->
        <label>Titolo</label>
        <input type="text" id="titolo">

        <!-- DESCRIZIONE LUNGA -->
        <label>Descrizione</label>
        <textarea id="descrizione"></textarea>

        <!-- PREZZO -->
        <label>Prezzo (€)</label>
        <input type="number" id="prezzo" step="0.01">

        <!-- IMMAGINE -->
        <label>Immagine prodotto</label>
        <input type="file" id="immagine" accept="image/*">

        <!-- URL immagine -->
        <input type="url" id="immagine-url" placeholder="oppure incolla URL immagine">

        <img id="preview-img" class="preview-img" style="display:none;">

        <!-- FILE PRODOTTO -->
        <label>File prodotto (PDF / ZIP / altro)</label>
        <input type="file" id="fileProdotto">

        <!-- SALVA -->
        <button id="btn-salva" class="btn-primario">Salva prodotto</button>

        <p id="status" style="margin-top:15px;"></p>

      </div>

    </section>

  </main>

  <!-- FOOTER ADMIN DINAMICO -->
  <div id="footer-admin-placeholder"></div>

  <!-- JS GLOBALI ADMIN -->
  <script src="loader-admin.js"></script>
  <script src="seo-admin.js"></script>
  <script src="structured-data-admin.js"></script>

  <!-- JS SPECIFICO UNIFICATO -->
  <script src="admin-prodotti.js"></script>

</body>
</html>

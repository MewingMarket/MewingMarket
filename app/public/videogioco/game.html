<!--
  FILE: game.html
  PATH: /app/public/videogioco/game.html
  DESC: Interfaccia videogioco completa con sfondo, navbar, LIM moderna e chat.
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <title>Game | MewingMarket</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>

<body>

  <!-- =========================================================
       NAVBAR SUPERIORE
  ========================================================== -->
  <div id="top-menu">
    <button onclick="goTo('screen-launcher')">Home</button>
    <button onclick="goTo('screen-avatar')">Cambia avatar</button>
    <button onclick="goTo('screen-home')">Cambia bot</button>
    <button onclick="goTo('screen-newgame')">Nuova partita</button>
    <button onclick="goTo('screen-loading')">Continua partita</button>
    <button onclick="exitGame()">Salva ed esci</button>
  </div>

  <!-- =========================================================
       SCREEN 1 — LAUNCHER
  ========================================================== -->
  <div class="screen" id="screen-launcher">
    <div class="launcher-box">
      <img src="/chat-icon.png" class="launcher-icon" alt="Launcher" onclick="goTo('screen-login')">
      <h2 class="launcher-subtitle">Gioca con i Bot</h2>
    </div>
  </div>

  <!-- =========================================================
       SCREEN 2 — LOGIN
  ========================================================== -->
  <div class="screen" id="screen-login">
    <h2>Come ti chiami?</h2>
    <input id="player-name" type="text" placeholder="Il tuo nome">
    <button onclick="saveName()">Continua</button>
  </div>

  <!-- =========================================================
       SCREEN 3 — SCELTA AVATAR
  ========================================================== -->
  <div class="screen" id="screen-avatar">
    <h2>Scegli il tuo avatar</h2>

    <div class="avatar-grid">
      <div class="avatar-card" data-avatar="male">
        <img src="/videogioco/uomo saggio.png" alt="Avatar Uomo">
        <span>Uomo</span>
      </div>

      <div class="avatar-card" data-avatar="female">
        <img src="/videogioco/donna saggia.png" alt="Avatar Donna">
        <span>Donna</span>
      </div>
    </div>

    <button id="avatar-confirm" disabled onclick="confirmAvatar()">Conferma</button>
  </div>

  <!-- =========================================================
       SCREEN 4 — HOME (MENU PRINCIPALE)
  ========================================================== -->
  <div class="screen" id="screen-home">

    <div id="home-avatar-box">
      <img id="home-avatar" src="/videogioco/uomo saggio.png" alt="Guida">
    </div>

    <div id="home-message" class="textarea-msg typewriter">
      Benvenuto nel gioco!<br>
      Scegli un’opzione qui sotto.
    </div>

    <h2 id="welcome-title"></h2>

    <!-- ⭐ HUD XP / LIVELLO -->
    <div id="hud-xp-level" style="
      margin-top:20px;
      padding:12px 18px;
      background:rgba(0,0,0,0.55);
      border-radius:12px;
      display:inline-block;
      color:#fff;
      font-size:16px;
      text-align:center;
      min-width:220px;
    ">
      <div><b>Livello:</b> <span id="hud-level">1</span></div>
      <div><b>XP:</b> <span id="hud-xp">0</span></div>

      <div style="
        margin-top:8px;
        width:100%;
        height:10px;
        background:rgba(255,255,255,0.2);
        border-radius:6px;
        overflow:hidden;
      ">
        <div id="hud-xp-bar" style="
          height:100%;
          width:0%;
          background:#4caf50;
          transition:0.4s;
        "></div>
      </div>
    </div>

    <div id="bot-buttons">
      <button onclick="chooseBot('vendor')">Venditore</button>
      <button onclick="chooseBot('influencer')">Influencer</button>
      <button onclick="chooseBot('professor')">Professore</button>
      <button onclick="chooseBot('newsletter')">Newsletter</button>
      <button onclick="chooseBot('generic')">Generico</button>
    </div>

  </div>

  <!-- =========================================================
       SCREEN 5 — CHAT (LIM MODERNA + CHATBOX)
  ========================================================== -->
  <div class="screen" id="screen-chat">

    <div id="classroom-layer">

      <!-- LIM MODERNA -->
      <div id="lim-area">
        <div id="lim-screen"></div>
      </div>

      <!-- AVATAR -->
      <div id="avatar-area">
        <img id="avatar-img" src="/videogioco/uomo saggio.png" alt="Avatar">
      </div>

    </div>

    <!-- CHATBOX -->
    <div id="chat-panel">
      <div id="chat-box"></div>

      <div id="chat-input-area">
        <input id="chat-input" type="text" placeholder="Scrivi un messaggio...">
        <button id="chat-send">➤</button>
        <button id="chat-voice">🎤</button>
        <button id="chat-attach">📎</button>
        <input id="chat-file" type="file" hidden>
      </div>
    </div>

  </div>

  <!-- =========================================================
       SCREEN 6 — NUOVA PARTITA
  ========================================================== -->
  <div class="screen" id="screen-newgame">
    <h2>Nuova Partita</h2>
    <p>Inizia una nuova avventura con i bot.</p>
    <button onclick="startNewGame()">Inizia</button>
  </div>

  <!-- =========================================================
       SCREEN 7 — CONTINUA PARTITA
  ========================================================== -->
  <div class="screen" id="screen-loading" style="text-align:center; padding-top:80px; color:#fff;">
    <h2>Continua Partita</h2>

    <p style="margin-top:10px; opacity:0.8;">Seleziona una partita salvata</p>

    <select id="saved-games"
            style="padding:12px; font-size:18px; margin-top:20px; border-radius:8px; width:260px;">
      <option value="">Caricamento...</option>
    </select>

    <br>

    <button onclick="loadSelectedGame()"
            style="margin-top:25px; padding:12px 20px; font-size:18px; border-radius:10px; cursor:pointer;">
      Carica Partita
    </button>
  </div>

  <!-- =========================================================
       SCRIPT
  ========================================================== -->
  <script src="game.js"></script>
  <script src="chat.js"></script>

</body>
</html>

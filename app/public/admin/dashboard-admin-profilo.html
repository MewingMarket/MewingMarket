<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS UNICO ADMIN -->
  <link rel="stylesheet" href="dashboard-admin.css">
</head>

<body class="dashboard-body">

  <!-- HEADER ADMIN SEMPLICE -->
  <header class="admin-header">
    <div class="admin-header-container">

      <!-- LOGO / TITOLO -->
      <div class="admin-logo">
        <a href="dashboard-admin-profilo.html">MewingMarket — Area Admin</a>
      </div>

      <!-- NAV ADMIN -->
      <nav class="admin-nav">
        <ul>
          <li><a href="dashboard-admin-profilo.html">Profilo</a></li>
          <li><a href="admin-prodotti.html">Prodotti</a></li>
          <li><a href="dashboard-vendite.html">Dashboard vendite</a></li>
          <li><a href="ordini.html">Ordini</a></li>
          <li><a href="feedback.html">Feedback</a></li>
          <li><a href="settings.html">Impostazioni</a></li>
          <li><a href="#" id="logout-admin">Logout</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <main class="pagina-standard">

    <section class="box-standard">
      <h1>Profilo Admin</h1>

      <p class="user-meta">
        Email: <span id="adminEmailMain"></span><br>
        Ruolo: <span id="adminRoleMain"></span>
      </p>

      <div class="field-group">
        <h3>Cambia email</h3>
        <label for="newAdminEmail">Nuova email</label>
        <input type="email" id="newAdminEmail" placeholder="Nuova email">
        <label for="passwordAdminEmail">Password attuale</label>
        <input type="password" id="passwordAdminEmail" placeholder="Password attuale">
        <button class="btn" id="btnAdminCambiaEmail">Aggiorna email</button>
        <div class="status" id="msgAdminEmail"></div>
      </div>

      <div class="field-group">
        <h3>Cambia password</h3>
        <label for="oldAdminPassword">Password attuale</label>
        <input type="password" id="oldAdminPassword" placeholder="Password attuale">
        <label for="newAdminPassword">Nuova password</label>
        <input type="password" id="newAdminPassword" placeholder="Nuova password">
        <button class="btn" id="btnAdminCambiaPassword">Aggiorna password</button>
        <div class="status" id="msgAdminPassword"></div>
      </div>
    </section>

  </main>

  <!-- FOOTER ADMIN SEMPLICE -->
  <footer class="admin-footer">
    <p>© 2026 MewingMarket — Area Admin · <a href="../index.html">Torna al sito principale</a></p>
  </footer>

  <!-- JS -->
  <script src="dashboard-admin.js"></script>

</body>
</html>

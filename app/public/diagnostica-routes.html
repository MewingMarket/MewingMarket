<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Diagnostica Route — MewingMarket</title>
<style>
  body { font-family: Arial; padding: 20px; background: #fafafa; }
  h1 { margin-top: 0; }
  .ok { color: green; }
  .err { color: red; }
  .warn { color: orange; }
  pre { background: #eee; padding: 10px; border-radius: 6px; }
  .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<h1>Diagnostica Route — MewingMarket</h1>
<p>Analisi automatica delle API, route mancanti, risposte vuote, HTML, errori silenziosi.</p>

<div id="output"></div>

<script>
async function test(url) {
  try {
    const r = await fetch(url);
    const text = await r.text();
    let type = "json";

    try { JSON.parse(text); }
    catch { type = "html"; }

    return { url, status: r.status, text, type };
  } catch (e) {
    return { url, status: "ERR", text: e.message, type: "error" };
  }
}

async function run() {
  const routes = [
    "/api/prodotti",
    "/api/catalogo",
    "/api/recensioni-top",
    "/api/versione",
    "/api/me",
    "/api/utenti/evento",
    "/api/product-page",
    "/api/system-status",
    "/api/meta-feed",
    "/api/newsletter",
  ];

  const results = [];
  for (const r of routes) results.push(await test(r));

  const out = document.getElementById("output");

  // ============================
  // SEZIONE 1 — RISULTATI GREZZI
  // ============================
  out.innerHTML += `<div class="box"><h2>1) Risultati grezzi</h2><pre>${JSON.stringify(results, null, 2)}</pre></div>`;

  // ============================
  // SEZIONE 2 — API OK
  // ============================
  const ok = results.filter(r => r.status == 200 && r.type == "json" && r.text.trim() !== "{}");
  out.innerHTML += `<div class="box"><h2 class="ok">2) API OK</h2>${ok.map(r => `<div>🟩 ${r.url}</div>`).join("")}</div>`;

  // ============================
  // SEZIONE 3 — JSON VUOTO
  // ============================
  const empty = results.filter(r => r.status == 200 && r.text.trim() === "{}");
  out.innerHTML += `<div class="box"><h2 class="warn">3) API che rispondono JSON vuoto</h2>${empty.map(r => `<div>🟧 ${r.url}</div>`).join("")}</div>`;

  // ============================
  // SEZIONE 4 — HTML
  // ============================
  const html = results.filter(r => r.type == "html");
  out.innerHTML += `<div class="box"><h2 class="err">4) API che rispondono HTML (ERRORE)</h2>${html.map(r => `<div>🟥 ${r.url}</div>`).join("")}</div>`;

  // ============================
  // SEZIONE 5 — ERRORI
  // ============================
  const errors = results.filter(r => r.status === "ERR");
  out.innerHTML += `<div class="box"><h2 class="err">5) API con errore</h2>${errors.map(r => `<div>🟥 ${r.url} → ${r.text}</div>`).join("")}</div>`;
}

run();
</script>

</body>
</html>
